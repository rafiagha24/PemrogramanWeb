<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Registrasi Mata Kuliah - LibraryReg Admin</title>

    <!-- Bootstrap 4 CSS & Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .content-wrapper {
        flex: 1;
      }

      /* Styling Dropdown Autocomplete */
      .autocomplete-wrapper {
        position: relative;
      }

      .autocomplete-suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 1000;
        background: #ffffff;
        border: 1px solid #ced4da;
        border-top: none;
        border-radius: 0 0 0.25rem 0.25rem;
        max-height: 200px;
        overflow-y: auto;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        display: none;
      }

      .autocomplete-item {
        padding: 0.5rem 0.75rem;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .autocomplete-item:hover {
        background-color: #f8f9fa;
        color: #007bff;
      }

      .autocomplete-item mark {
        background-color: #ffe8a1;
        padding: 0;
      }
    </style>
  </head>
  <body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand font-weight-bold" href="admin.html">
          <img src="https://placehold.co/30x30/ffffff/007bff?text=LR" width="30" height="30" class="d-inline-block align-top mr-1" alt="Logo">
          LibraryReg <span class="badge badge-warning ml-1 text-dark" style="font-size: 0.7rem;">ADMIN</span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarAdmin" aria-controls="navbarAdmin" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarAdmin">
          <div class="form-inline my-2 my-lg-0 text-white">
            <span class="mr-3 small"><i class="fas fa-user-circle mr-1"></i> Petugas: <strong id="adminUsername">admin</strong></span>
            <button type="button" class="btn btn-outline-light btn-sm" id="btnLogout">
              <i class="fas fa-sign-out-alt mr-1"></i> Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- KONTEN UTAMA -->
    <div class="content-wrapper my-4">
      <div class="container">
        
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-7">

            <!-- HEADER HALAMAN -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
              <div>
                <h2 class="font-weight-bold text-dark mb-1">
                  <i class="fas fa-file-signature text-primary mr-2"></i>Form Registrasi Mata Kuliah
                </h2>
                <p class="text-muted mb-0">Isi data pendaftaran mata kuliah untuk mahasiswa terdaftar.</p>
              </div>
              <a href="admin.html" class="btn btn-outline-primary btn-sm">
                <i class="fas fa-arrow-left mr-1"></i> Kembali ke Data Anggota
              </a>
            </div>

            <!-- CONTAINER NOTIFIKASI -->
            <div id="alertContainer"></div>

            <!-- CARD FORM REGISTRASI -->
            <div class="card shadow-sm border-0">
              <div class="card-body p-4">

                <form id="registrationForm" autocomplete="off" novalidate>
                  
                  <!-- 1. Nama Mahasiswa (Dengan Autocomplete) -->
                  <div class="form-group autocomplete-wrapper">
                    <label for="namaMahasiswa" class="font-weight-bold">
                      Nama Mahasiswa <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                      </div>
                      <input type="text" class="form-control" id="namaMahasiswa" placeholder="Ketik huruf untuk melihat rekomendasi nama..." required>
                    </div>
                    <!-- Dropdown List Rekomendasi -->
                    <div id="suggestionsList" class="autocomplete-suggestions"></div>
                    <small class="form-text text-muted">Coba ketik nama seperti "Ahmad", "Dahlia", atau "Rafi".</small>
                  </div>

                  <!-- 2. NIM -->
                  <div class="form-group">
                    <label for="nim" class="font-weight-bold">
                      NRP / NIM <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                      </div>
                      <input type="text" class="form-control" id="nim" placeholder="Masukkan NRP/NIM mahasiswa" required>
                    </div>
                  </div>

                  <!-- 3. Mata Kuliah -->
                  <div class="form-group">
                    <label for="mataKuliah" class="font-weight-bold">
                      Mata Kuliah <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-book"></i></span>
                      </div>
                      <select class="form-control" id="mataKuliah" required>
                        <option value="" disabled selected>-- Pilih Mata Kuliah --</option>
                        <option value="Pemrograman Berorientasi Objek">Pemrograman Berorientasi Objek</option>
                        <option value="Algoritma & Struktur Data">Algoritma & Struktur Data</option>
                        <option value="Pengembangan Game 2D">Pengembangan Game 2D</option>
                        <option value="Jaringan Komputer">Jaringan Komputer</option>
                        <option value="Kecerdasan Buatan">Kecerdasan Buatan</option>
                      </select>
                    </div>
                  </div>

                  <!-- 4. Dosen Pengampu -->
                  <div class="form-group">
                    <label for="dosen" class="font-weight-bold">
                      Dosen Pengampu <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-user-tie"></i></span>
                      </div>
                      <select class="form-control" id="dosen" required>
                        <option value="" disabled selected>-- Pilih Dosen Pengampu --</option>
                        <option value="Dr. Ir. Bambang Hermanto, M.T.">Dr. Ir. Bambang Hermanto, M.T.</option>
                        <option value="Siti Aminah, M.Kom.">Siti Aminah, M.Kom.</option>
                        <option value="Prof. Hendra Wijaya, Ph.D.">Prof. Hendra Wijaya, Ph.D.</option>
                        <option value="Dr. Eng. Rina Lestari, S.T., M.Eng.">Dr. Eng. Rina Lestari, S.T., M.Eng.</option>
                      </select>
                    </div>
                  </div>

                  <hr class="my-4">

                  <!-- Tombol Submit -->
                  <button type="submit" class="btn btn-primary btn-block font-weight-bold py-2">
                    <i class="fas fa-paper-plane mr-1"></i> Kirim Registrasi
                  </button>

                </form>

              </div>
            </div>

          </div>
        </div>

      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        
        // Cek login admin
        const loggedInUser = sessionStorage.getItem('loggedInUser') || 'admin';
        document.getElementById('adminUsername').textContent = loggedInUser;

        // Data referensi mahasiswa untuk autokomplit nama
        const DATA_MAHASISWA = [
          { nama: "Ahmad Hallington", nim: "5025211001" },
          { nama: "Ahmad Subagyo", nim: "5025211002" },
          { nama: "Dahlia Putri", nim: "5025211042" },
          { nama: "Dian Sastro", nim: "5025211015" },
          { nama: "Fikri Ramadhan", nim: "5025211020" },
          { nama: "Gilang Permana", nim: "5025211033" },
          { nama: "Rafi Atha Maulana", nim: "5025211088" },
          { nama: "Rahmat Hidayat", nim: "5025211090" },
          { nama: "Siti Aminah", nim: "5025211050" }
        ];

        const inputNama = document.getElementById('namaMahasiswa');
        const inputNim = document.getElementById('nim');
        const suggestionsList = document.getElementById('suggestionsList');
        const form = document.getElementById('registrationForm');
        const alertContainer = document.getElementById('alertContainer');
        const btnLogout = document.getElementById('btnLogout');

        // Autocomplete berdasarkan huruf
        inputNama.addEventListener('input', function () {
          const query = this.value.trim().toLowerCase();
          suggestionsList.innerHTML = '';

          if (query.length === 0) {
            suggestionsList.style.display = 'none';
            return;
          }

          const matches = DATA_MAHASISWA.filter(m => m.nama.toLowerCase().includes(query));

          if (matches.length === 0) {
            suggestionsList.style.display = 'none';
            return;
          }

          matches.forEach(item => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item';

            const regex = new RegExp(`(${query})`, 'gi');
            const highlightedNama = item.nama.replace(regex, '<mark>$1</mark>');

            div.innerHTML = `
              <span>${highlightedNama}</span>
              <small class="text-muted">${item.nim}</small>
            `;

            div.addEventListener('click', function () {
              inputNama.value = item.nama;
              inputNim.value = item.nim;
              suggestionsList.style.display = 'none';
            });

            suggestionsList.appendChild(div);
          });

          suggestionsList.style.display = 'block';
        });

        // Sembunyikan rekomendasi saat klik di luar area
        document.addEventListener('click', function (e) {
          if (!inputNama.contains(e.target) && !suggestionsList.contains(e.target)) {
            suggestionsList.style.display = 'none';
          }
        });

        // Handler Submit Form
        form.addEventListener('submit', function (e) {
          e.preventDefault();

          const nama = inputNama.value.trim();
          const nim = inputNim.value.trim();
          const mataKuliah = document.getElementById('mataKuliah').value;
          const dosen = document.getElementById('dosen').value;

          if (!nama || !nim || !mataKuliah || !dosen) {
            alertContainer.innerHTML = `
              <div class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
                Harap lengkapi semua kolom pendaftaran terlebih dahulu.
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
                </button>
              </div>
            `;
            return;
          }

          alertContainer.innerHTML = `
            <div class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
              <strong>Registrasi Berhasil!</strong><br>
              Mahasiswa: <b>${nama}</b> (${nim}) telah terdaftar pada mata kuliah <b>${mataKuliah}</b> dengan dosen pengampu <b>${dosen}</b>.
              <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
          `;

          form.reset();
          suggestionsList.style.display = 'none';
        });

        // Logout
        btnLogout.addEventListener('click', function() {
          if (confirm('Apakah Anda yakin ingin keluar dari panel pengelola?')) {
            sessionStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('loggedInUser');
            window.location.href = 'login.html';
          }
        });

      });
    </script>
  </body>
</html>
