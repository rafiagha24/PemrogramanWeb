<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .register {
            min-height: 100vh;
        }

        .bg-image {
            background-image: url('mount.jpg');
            background-size: cover;
            background-position: center;
        }

        .register-heading {
            font-weight: 300;
        }

        .btn-register {
            font-size: 0.9rem;
            letter-spacing: 0.05rem;
            padding: 0.75rem 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid ps-md-0">
        <div class="row g-0">
            <div class="d-none d-md-flex col-md-4 col-lg-6 bg-image"></div>
            <div class="col-md-8 col-lg-6">
                <div class="register d-flex align-items-center py-5">
                    <div class="container">
                        <div class="row">
                            <div class="col-md-9 col-lg-8 mx-auto">
                                
                                <!-- Tombol Kembali (Atas) -->
                                <div class="mb-4">
                                    <a href="index.html" class="text-decoration-none text-muted small">
                                        &larr; Kembali ke Beranda
                                    </a>
                                </div>

                                <h3 class="register-heading mb-4">Create an account!</h3>

                                <!-- Sign Up Form -->
                                <form>
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="floatingName" placeholder="Full Name" required>
                                        <label for="floatingName">Full Name</label>
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
                                        <label for="floatingInput">Email address</label>
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                                        <label for="floatingPassword">Password</label>
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input type="password" class="form-control" id="floatingConfirmPassword" placeholder="Confirm Password" required>
                                        <label for="floatingConfirmPassword">Confirm Password</label>
                                    </div>

                                    <div class="form-check mb-3">
                                        <input class="form-check-input" type="checkbox" value="" id="termsCheck" required>
                                        <label class="form-check-label" for="termsCheck">
                                            I agree to the <a href="#" class="text-decoration-none">Terms & Conditions</a>
                                        </label>
                                    </div>

                                    <div class="d-grid gap-2">
                                        <button class="btn btn-lg btn-primary btn-register text-uppercase fw-bold mb-2" type="submit">Sign up</button>
                                        
                                        <div class="text-center">
                                            <a class="small" href="login.html">Already have an account? Sign in</a>
                                        </div>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
